[build]
  publish = "."
  functions = "netlify/functions"

# The SOKO Development site uses this catalog as its fallback copy
[[headers]]
  for = "/selections/data/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"

# Client portal: private pages. Keep out of search, never send the link to other sites,
# no third-party scripts, and don't let browsers or proxies keep a copy.
[[headers]]
  for = "/client/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Referrer-Policy = "no-referrer"
    Cache-Control = "no-cache"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"

# Client portal background job: new links, completion dates, client emails
[functions."portal-sync"]
  schedule = "*/5 * * * *"

# ADU re-engagement drip. Runs daily at 9:00 AM Phoenix time (16:00 UTC; Arizona has no DST).
# It only emails leads whose Monday "Drip Status" is Active and whose last email was 14+ days ago.
# Moved here from the old arizona-adu.netlify.app site in November 2026. It must run on ONE site only.
[functions."re-engage"]
  schedule = "0 16 * * *"
